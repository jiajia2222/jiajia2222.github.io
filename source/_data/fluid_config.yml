# Fluid theme overrides for Mou Blog.
favicon: /img/fluid.png
apple_touch_icon: /img/fluid.png

dark_mode:
  enable: true
  default: auto

color:
  body_bg_color: "#f4f7fb"
  body_bg_color_dark: "#151923"
  navbar_bg_color: "#19253a"
  navbar_bg_color_dark: "#101827"
  text_color: "#26364a"
  text_color_dark: "#e7edf6"
  sec_text_color: "#6b7b90"
  sec_text_color_dark: "#aebbd0"
  board_color: "#ffffff"
  board_color_dark: "#202938"
  post_text_color: "#2f4055"
  post_text_color_dark: "#e7edf6"
  post_heading_color: "#17243a"
  post_heading_color_dark: "#f3f6fb"
  post_link_color: "#e85d75"
  post_link_color_dark: "#ff8da0"
  link_hover_color: "#c93f5a"
  link_hover_color_dark: "#ffb0bd"
  link_hover_bg_color: "#fff1f3"
  link_hover_bg_color_dark: "#3b2a35"
  line_color: "#e3eaf3"
  line_color_dark: "#3d4b61"

navbar:
  blog_title: "Mou Blog"
  ground_glass:
    enable: true
    px: 6
    alpha: 0.78
  menu:
    - { key: "home", link: "/", icon: "iconfont icon-home-fill" }
    - { key: "archive", link: "/archives/", icon: "iconfont icon-archive-fill" }
    - { key: "about", link: "/about/", icon: "iconfont icon-user-fill" }

search:
  enable: true
  path: /local-search.xml
  generate_path: /local-search.xml
  field: post
  content: true

index:
  banner_img: /img/default.png
  banner_img_height: 72
  banner_mask_alpha: 0.28
  slogan:
    enable: true
    text: "记录技术、折腾与生活"
  auto_excerpt:
    enable: true
  post_meta:
    date: true
    category: false
    tag: false

post:
  banner_img: /img/default.png
  banner_img_height: 48
  banner_mask_alpha: 0.28
  meta:
    author:
      enable: true
    date:
      enable: true
      format: "LL"
    wordcount:
      enable: true
    min2read:
      enable: true
      awl: 2
      wpm: 60
  updated:
    enable: true
    date_format: "LL"

archive:
  banner_img: /img/default.png
  banner_img_height: 52
  banner_mask_alpha: 0.28

about:
  enable: true
  banner_img: /img/default.png
  banner_img_height: 52
  banner_mask_alpha: 0.28
  avatar: https://yun.nadev.xyz/file/1780401843349_images.jpg
  name: "Jiamou"
  intro: "一个记录技术、网络服务与日常折腾的小博客"
  icons:
    - { class: "iconfont icon-github-fill", link: "https://github.com/jiajia2222", tip: "GitHub" }

footer:
  content: '
    <span>© 2026 Mou Blog</span>
    <span class="iconfont icon-love"></span>
    <a href="https://github.com/fluid-dev/hexo-theme-fluid" target="_blank" rel="nofollow noopener">Fluid</a>
  '
